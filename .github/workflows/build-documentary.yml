name: build documentary
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project dir under projects/"
        required: false
        default: "projects/blackpink-no-next"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U bgutil-ytdlp-pot-provider
          pip install ytagent-cli || echo "ytagent-cli unavailable — ladder falls back to yt-dlp"
          PLUGIN_DIR=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'] + '/yt_dlp_plugins')")
          echo "YTDLP_PLUGIN_DIRS=$PLUGIN_DIR" >> $GITHUB_ENV
          yt-dlp --version
          ls "$PLUGIN_DIR" || echo "PLUGIN DIR MISSING"

      - name: download farm infra (WARP + BGutil POT)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status || true
          echo "WARP_PROXY=http://127.0.0.1:40000" >> $GITHUB_ENV
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --production || npm install
          npm install typescript
          ./node_modules/.bin/tsc || true
          nohup node build/main.js --port 4416 &
          sleep 5
          curl -s http://127.0.0.1:4416/ping && echo "POT server OK"
          echo "BGUTIL_URL=http://127.0.0.1:4416" >> $GITHUB_ENV

      - name: build (full cycle)
        run: python -m engine.cli build ${{ inputs.project }}
        env:
          HOME: /home/runner
          SOURCE_PACK_BASE: https://github.com/superz1402/last-stop-yt-engine/releases/download/source-pack

      - name: upload build reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ inputs.project }}/build/*.json
            ${{ inputs.project }}/build/.done/
          if-no-files-found: ignore

      - name: upload final (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final
          path: ${{ inputs.project }}/build/final.mp4
          if-no-files-found: ignore
